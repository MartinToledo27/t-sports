name: Actualizar estadisticas NBA

on:
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * *'
    - cron: '15 17 * * *'

permissions:
  contents: write

concurrency:
  group: actualizar-estadisticas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Bajar promedios de equipos y jugadores
        working-directory: nba
        run: python3 estadisticas.py

      - name: Guardar si hay cambios
        run: |
          git config user.name "robot-agenda"
          git config user.email "robot-agenda@users.noreply.github.com"
          git add nba/estadisticas.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar estadisticas NBA"
            for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 5; done
          fi
