<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:400 16px/1.2 var(--fb);-webkit-text-size-adjust:100%;overflow:hidden}
.top{position:relative;flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#3b3634;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 10px}
.top::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#5e8800,#8cd700,#2d9725,#8cd700,#5e8800) 0 0/300px 100%;animation:flujo 5s linear infinite}
.lg{display:block;height:28px;width:auto;min-width:0;max-width:100%}
.der{display:flex;align-items:center;gap:6px;flex:none}
.sel{display:flex;gap:6px}
.pill{position:relative;overflow:hidden;display:flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:999px;border:1.5px solid rgba(255,255,255,.28);background:transparent;color:#e9e7e4;font:800 italic 15px/1 var(--fd);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;transition:transform .12s,box-shadow .25s,border-color .25s}
.pill:active{transform:scale(.95)}
.pill svg{width:14px;height:14px;color:var(--c)}
.pill[aria-selected=true]{color:#fff;border-color:transparent;background:linear-gradient(100deg,#5e8800,#8cd700,#2d9725,#8cd700,#5e8800) 0 0/200px 100%;animation:flujo2 4s linear infinite;box-shadow:0 0 0 2px var(--c),0 0 14px -1px var(--c)}
.pill[aria-selected=true] svg{color:#fff}
.pill[aria-selected=true]::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:brillo 3.2s ease-in-out infinite}
.tema{display:grid;place-items:center;width:30px;height:30px;padding:0;border-radius:50%;border:1.5px solid rgba(255,255,255,.28);background:transparent;color:#e9e7e4;cursor:pointer}
.tema svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;display:none}
.tema[data-m=auto] .i-a,.tema[data-m=light] .i-l,.tema[data-m=dark] .i-d{display:block}
.pill:focus-visible,.tema:focus-visible{outline:2px solid #8cd700;outline-offset:2px}
main{position:relative;flex:1;min-height:0;padding-bottom:env(safe-area-inset-bottom,0px)}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,transform .25s,visibility 0s .25s}
#fr-nba{transform:translateX(-18px)}#fr-f1{transform:translateX(18px)}
iframe.on{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition-delay:0s}
@keyframes flujo{to{background-position:300px 0}}
@keyframes flujo2{to{background-position:200px 0}}
@keyframes brillo{0%,55%{left:-60%}100%{left:130%}}
@media(prefers-reduced-motion:reduce){.top::after,.pill,.pill::after{animation:none!important}iframe{transition:none}}
</style>
</head>

<div class="der">
<nav class="sel" role="tablist" aria-label="Deporte">

<button class="tema" id="tema" data-m="auto" aria-label="Tema: automático"><svg class="i-a" viewBox="0 0 18 18"><circle cx="9" cy="9" r="6.5"/><path d="M9 2.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg><svg class="i-l" viewBox="0 0 18 18"><circle cx="9" cy="9" r="3.4"/><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.7 3.7l1.4 1.4M12.9 12.9l1.4 1.4M3.7 14.3l1.4-1.4M12.9 5.1l1.4-1.4"/></svg><svg class="i-d" viewBox="0 0 18 18"><path d="M15 10.8A6.3 6.3 0 0 1 7.2 3a6.3 6.3 0 1 0 7.8 7.8z"/></svg></button>

<main>
<iframe id="fr-nba" title="Agenda NBA" data-src="nba/"></iframe>
<iframe id="fr-f1" title="Agenda F1" data-src="f1/"></iframe>
</main>
<script>
const KS=['nba','f1'],TM=['auto','light','dark'],ET={auto:'autom\u00e1tico',light:'claro',dark:'oscuro'};
let tema='auto';
try{tema=localStorage.getItem('tsport_tema')||'auto'}catch(e){}
if(!TM.includes(tema))tema='auto';
const btn=document.getElementById('tema');
function pinta(el){if(!el)return;if(tema==='auto')el.removeAttribute('data-theme');else el.setAttribute('data-theme',tema)}
function aplicarTema(){
  pinta(document.documentElement);
  document.querySelectorAll('iframe').forEach(f=>{try{pinta(f.contentDocument.documentElement)}catch(e){}});
  btn.dataset.m=tema;btn.setAttribute('aria-label','Tema: '+ET[tema]);btn.title='Tema: '+ET[tema];
}
btn.addEventListener('click',()=>{tema=TM[(TM.indexOf(tema)+1)%3];try{localStorage.setItem('tsport_tema',tema)}catch(e){}aplicarTema()});
document.querySelectorAll('iframe').forEach(f=>f.addEventListener('load',aplicarTema));
function inicial(){
  let k=(location.hash||'').slice(1);
  if(!KS.includes(k)){try{k=localStorage.getItem('tsport_deporte')}catch(e){}}
  return KS.includes(k)?k:'nba';
}
function show(k){
  for(const id of KS){
    const f=document.getElementById('fr-'+id);
    if(id===k&&!f.getAttribute('src'))f.src=f.dataset.src;
    f.classList.toggle('on',id===k);
  }
  document.querySelectorAll('.pill').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===k));
  try{localStorage.setItem('tsport_deporte',k)}catch(e){}
  try{history.replaceState(null,'','#'+k)}catch(e){}
}
document.querySelectorAll('.pill').forEach(b=>b.addEventListener('click',()=>show(b.dataset.k)));
addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(KS.includes(k))show(k)});
aplicarTema();show(inicial());
if(matchMedia('(prefers-reduced-motion:reduce)').matches){try{document.getElementById('lg').pauseAnimations()}catch(e){}}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
